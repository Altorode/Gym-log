<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Log</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f5f9;--card:#fff;--text:#14171f;--muted:#667085;--line:#e3e6ee;--accent:#2563eb;--accent-text:#fff;--accent2:#d97706;--danger:#d92d20;--ok:#12a150;--shadow:0 1px 3px rgba(16,24,40,.08);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#1a1d25;--text:#eef0f5;--muted:#9aa3b5;--line:#2a2f3b;--accent:#6ea0ff;--accent-text:#0b1020;--accent2:#fbbf24;--danger:#ff6b61;--ok:#4ade80;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior-y:contain}
#app{min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;display:flex;align-items:center;gap:10px;max-width:640px;width:100%;margin:0 auto}
header.top h1{font-size:22px;margin:0;line-height:1.2}
main{flex:1;padding:4px 16px 110px;max-width:640px;width:100%;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.tabs button{flex:1;min-height:64px;border:0;background:none;color:var(--muted);font:inherit;font-size:17px;font-weight:800;letter-spacing:.2px;display:flex;align-items:center;justify-content:center;position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:4px;border-radius:0 0 4px 4px;background:var(--accent)}
nav.tabs button.gear{flex:0 0 68px;font-size:28px;font-weight:400}
.grow{flex:1;min-width:0}.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.mt{margin-top:12px}.center{text-align:center}
.muted{color:var(--muted)}.sm{font-size:13px}.ok{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}
.card.note{border-color:var(--accent2)}
.card.err{border-color:var(--danger)}
.card.next{border:2px solid var(--accent)}
.btn{min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.btn:active{opacity:.7}
.btn.primary{background:var(--accent);color:var(--accent-text);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.block{display:block;width:100%}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn.icon{min-width:48px;padding:0}
.btn.huge{min-height:68px;font-size:20px}
.link{background:none;border:0;color:inherit;font:inherit;text-align:left;padding:4px 0;min-height:44px;cursor:pointer}
label.lbl{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px 12px}
textarea{min-height:90px;resize:vertical}
input[type=checkbox]{width:28px;height:28px;min-height:0;flex:none}
.seg{display:flex;gap:8px;margin:6px 0}.seg .btn{flex:1}.seg .btn.on{background:var(--accent);color:var(--accent-text);border-color:transparent}
.chip{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:48px;padding:0 14px;margin:3px 6px 3px 0;border-radius:22px;background:var(--bg);border:1px solid var(--line);color:var(--text);font:inherit;font-weight:700}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.badge.warn{color:var(--accent2);border-color:var(--accent2)}
.exname{margin:0 0 4px;font-size:24px}
.setlbl{font-size:18px;font-weight:700;color:var(--accent)}
.target{font-size:44px;font-weight:800;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.lastnote{margin-top:10px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:14px;text-align:left}
.stepper{display:flex;gap:10px;align-items:center}
.stepper .btn{width:76px;height:76px;font-size:36px;padding:0;flex:none}
.stepper input{height:76px;font-size:40px;font-weight:800;text-align:center}
.timer{font-size:68px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:24px;z-index:30;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.ent{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:10px;fill:var(--muted)}.chart .ax.a{fill:var(--accent)}.chart .ax.b{fill:var(--accent2)}
.chart .l1{fill:none;stroke:var(--accent);stroke-width:2.5}.chart .l2{fill:none;stroke:var(--accent2);stroke-width:2;stroke-dasharray:5 4}
.chart .p1{fill:var(--accent)}.chart .p2{fill:var(--accent2)}.chart .sel{fill:none;stroke:var(--text);stroke-width:1.5;stroke-dasharray:3 3}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="overlay" hidden></div>
<div id="toast"></div>
<input type="file" id="restoreFile" accept=".json,application/json" hidden>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const r2=n=>Math.round(n*100)/100;
const fmt=n=>String(r2(n));
const DAY=864e5;
const dFmt=(t,o)=>new Date(t).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const tFmt=t=>new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const clock=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const range=(a,b)=>a===b?String(a):a+'–'+b;
let toastTimer;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}

/* ---------- storage ---------- */
const KEY='gymlog.v1';
let storageOK=true;
function blank(){return {v:1,created:Date.now(),exercises:{},workouts:[],sessions:[],lastBackup:null,active:null};}
function load(){
  try{
    localStorage.setItem('gymlog.test','1');localStorage.removeItem('gymlog.test');
    const t=localStorage.getItem(KEY);
    if(t){const d=JSON.parse(t);return Object.assign(blank(),d);}
  }catch(e){storageOK=false;}
  return blank();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){if(storageOK){storageOK=false;render();}}
}
let S=load();

/* ---------- ui state ---------- */
const ui={tab:'workouts',past:null,editWorkout:null,histMode:'sessions',chartEx:null,chartSel:null,reps:0,repsKey:'',summary:null,exf:null,edit:null,confirmFn:null,viewKey:''};
let deferredInstall=null;

/* ---------- audio / vibration / wake lock ---------- */
let actx=null;
function unlockAudio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  try{unlockAudio();if(!actx)return;const t0=actx.currentTime;
    [0,.25,.5].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=i===2?1175:880;
      g.gain.setValueAtTime(.0001,t0+d);g.gain.exponentialRampToValueAtTime(.45,t0+d+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+d+.2);
      o.connect(g);g.connect(actx.destination);o.start(t0+d);o.stop(t0+d+.22);});
  }catch(e){}
}
function alertUser(){try{if(navigator.vibrate)navigator.vibrate([300,120,300,120,500]);}catch(e){}beep();}
let wake=null;
async function requestWake(){
  try{if('wakeLock' in navigator&&S.active&&!wake&&document.visibilityState==='visible'){
    wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>{wake=null;});}}catch(e){}
}
function releaseWake(){try{if(wake)wake.release();}catch(e){}wake=null;}

/* ---------- modal ---------- */
function openModal(html){const m=$('#modal');m.innerHTML='<div class="sheet">'+html+'</div>';m.hidden=false;document.body.style.overflow='hidden';}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';document.body.style.overflow='';}
function confirmDlg(msg,okLabel,fn,danger){
  ui.confirmFn=fn;
  openModal('<p>'+msg+'</p><div class="row mt"><button class="btn grow" data-act="closeM">Cancel</button><button class="btn '+(danger?'danger':'primary')+' grow" data-act="confirmOk">'+esc(okLabel)+'</button></div>');
}

/* ---------- domain helpers ---------- */
function exSummary(ex){
  if(ex.type==='weighted')return ex.sets+'×'+range(ex.repMin,ex.repMax)+' · '+fmt(ex.weight)+' kg · +'+fmt(ex.inc)+' · rest '+ex.rest+'s';
  return ex.sets+'×'+range(ex.repMin,ex.repMax)+' reps · step '+(ex.repStep||1)+' · rest '+ex.rest+'s';
}
function workoutsUsing(exId){return S.workouts.filter(w=>w.items.some(i=>i.exId===exId));}
function makeEntry(ex){return {exId:ex.id,name:ex.name,type:ex.type,weight:ex.type==='weighted'?ex.weight:null,repMin:ex.repMin,repMax:ex.repMax,nSets:ex.sets,rest:ex.rest,sets:[],note:'',skipped:false,complete:false};}
function lastNote(exId){
  let best=null;
  for(const s of S.sessions)for(const e of s.entries)if(e.exId===exId&&e.note&&e.note.trim()&&(!best||s.start>best.t))best={t:s.start,note:e.note.trim()};
  return best;
}
function applyProgression(ex,e){
  const top=e.sets.every(r=>r>=e.repMax),low=e.sets.some(r=>r<e.repMin);
  if(e.type==='weighted'){
    const old=e.weight,inc=ex.inc||0;let nw=old;
    if(top)nw=r2(old+inc);else if(low)nw=Math.max(0,r2(old-inc));
    ex.weight=nw;
    return {name:e.name,from:fmt(old)+' kg',to:fmt(nw)+' kg',dir:nw>old?1:nw<old?-1:0};
  }
  const step=ex.repStep||1;let d=0;
  if(top)d=step;else if(low)d=-Math.min(step,e.repMin-1);
  ex.repMin=e.repMin+d;ex.repMax=e.repMax+d;
  return {name:e.name,from:range(e.repMin,e.repMax)+' reps',to:range(ex.repMin,ex.repMax)+' reps',dir:d>0?1:d<0?-1:0};
}
function todayISO(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function lastDone(wid){let b=null;S.sessions.forEach(s=>{if(s.workoutId===wid&&(b===null||s.start>b))b=s.start;});return b;}
function latestComplete(exId){let l=null;S.sessions.forEach(q=>q.entries.forEach(z=>{if(z.exId===exId&&z.complete&&(!l||q.start>=l.start))l={start:q.start,e:z};}));return l;}
// After a session is saved: if it is the most recent one overall, send its workout to the bottom of the list ("up next" is the top).
function rotateAfter(wid,start){
  if(S.sessions.some(s=>s.start>start))return;
  const i=S.workouts.findIndex(w=>w.id===wid);
  if(i>=0&&i<S.workouts.length-1){const w=S.workouts.splice(i,1)[0];S.workouts.push(w);}
}
function backupInfo(){return S.lastBackup?'Last backup: '+dFmt(S.lastBackup,{day:'numeric',month:'short',year:'numeric'}):'No backup yet';}
function backupDue(){
  if(!(S.sessions.length||Object.keys(S.exercises).length))return false;
  return Date.now()-(S.lastBackup||S.created||Date.now())>14*DAY;
}
function warn(){return storageOK?'':'<div class="card err"><b>Storage unavailable.</b> This browser is blocking saving (private mode or storage disabled), so your data will be lost when you close the app. Open the app in a normal Chrome window.</div>';}

/* ---------- views ---------- */
function navHtml(){
  const t=[['workouts','Workouts'],['library','Exercises'],['history','History']];
  return '<nav class="tabs">'+t.map(x=>'<button class="'+(ui.tab===x[0]?'on':'')+'" data-act="tab" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+
    '<button class="gear'+(ui.tab==='settings'?' on':'')+'" data-act="tab" data-t="settings" aria-label="Settings">&#9881;&#xFE0E;</button></nav>';
}
function workoutsView(){
  let h='<header class="top"><div class="grow"><h1>Workouts</h1><div class="muted sm">'+backupInfo()+'</div></div></header><main>'+warn();
  if(backupDue())h+='<div class="card note"><b>Time for a backup</b><div class="muted sm">It has been a while. A backup file protects your history if the phone is lost or Chrome data is cleared.</div><button class="btn sm mt" data-act="backup">Back up now</button></div>';
  if(!S.workouts.length)h+='<div class="card muted">No workouts yet. Create one (e.g. “Leg Day”), then add exercises to it.</div>';
  else h+='<div class="muted sm">The top workout is up next. When you finish a workout it moves to the bottom. Use ▲ ▼ to change the order.</div>';
  S.workouts.forEach((w,i)=>{
    const names=w.items.map(it=>S.exercises[it.exId]&&S.exercises[it.exId].name).filter(Boolean);
    const ld=lastDone(w.id);
    h+='<div class="card'+(i===0&&S.workouts.length>1?' next':'')+'"><div class="row"><b style="font-size:18px" class="grow">'+esc(w.name)+'</b>'+(i===0&&S.workouts.length>1?'<span class="badge" style="color:var(--accent);border-color:var(--accent)">Up next</span>':'')+'</div><div class="muted sm">'+(names.length?esc(names.join(' · ')):'No exercises yet')+'</div><div class="muted sm">'+(ld?'Last done: '+dFmt(ld):'Not done yet')+'</div>'+
    '<div class="row mt"><button class="btn primary grow" data-act="start" data-id="'+w.id+'">Start workout</button><button class="btn sm" data-act="editW" data-id="'+w.id+'">Edit</button></div>'+
    '<div class="row mt"><button class="btn sm icon" data-act="wUp" data-i="'+i+'" aria-label="Move up">▲</button><button class="btn sm icon" data-act="wDown" data-i="'+i+'" aria-label="Move down">▼</button></div></div>';
  });
  return h+'<button class="btn primary block mt" data-act="newW">+ New workout</button></main>';
}
function workoutEditor(){
  const w=S.workouts.find(x=>x.id===ui.editWorkout);
  if(!w){ui.editWorkout=null;return workoutsView();}
  let h='<header class="top"><button class="btn sm" data-act="backW">‹ Back</button><h1 class="grow">Edit workout</h1><button class="btn primary sm" data-act="finishW">Done</button></header><main>';
  h+='<label class="lbl" for="wName">Workout name</label><input id="wName" value="'+esc(w.name)+'" maxlength="40">';
  h+='<h3>Exercises</h3>';
  if(!w.items.length)h+='<div class="card muted">No exercises yet.</div>';
  w.items.forEach((it,i)=>{
    const ex=S.exercises[it.exId];if(!ex)return;
    h+='<div class="card"><button class="link block" data-act="editEx" data-id="'+ex.id+'"><b>'+esc(ex.name)+'</b><div class="muted sm">'+esc(exSummary(ex))+'</div></button>'+
    '<div class="row mt"><span class="badge '+(ex.workoutId?'warn':'')+' grow" style="text-align:center">'+(ex.workoutId?'Own copy (separate history)':'Shared progression')+'</span>'+
    '<button class="btn sm icon" data-act="iUp" data-i="'+i+'" aria-label="Move up">▲</button><button class="btn sm icon" data-act="iDown" data-i="'+i+'" aria-label="Move down">▼</button><button class="btn sm icon danger" data-act="iDel" data-i="'+i+'" aria-label="Remove">✕</button></div></div>';
  });
  h+='<button class="btn block" data-act="addEx">+ Add exercise</button>';
  h+='<div class="muted sm center mt">Changes are saved automatically as you go.</div><button class="btn primary block huge mt" data-act="finishW">✓ Finish and save workout</button>';
  h+='<button class="btn danger block mt" data-act="delW">Delete workout</button></main>';
  return h;
}
function libraryView(){
  const list=Object.values(S.exercises).filter(e=>!e.workoutId).sort((a,b)=>a.name.localeCompare(b.name));
  let h='<header class="top"><h1>Exercise library</h1></header><main>'+warn();
  if(!list.length)h+='<div class="card muted">No exercises yet. Create exercises here, or while adding to a workout.</div>';
  list.forEach(ex=>{
    const n=workoutsUsing(ex.id).length;
    h+='<div class="card"><button class="link block" data-act="editEx" data-id="'+ex.id+'"><b>'+esc(ex.name)+'</b><div class="muted sm">'+(ex.type==='weighted'?'Weighted':'Bodyweight')+' · '+esc(exSummary(ex))+'</div><div class="muted sm">Used in '+n+' workout'+(n===1?'':'s')+'</div></button></div>';
  });
  return h+'<button class="btn primary block mt" data-act="newEx">+ New exercise</button></main>';
}
function timerCard(A){
  if(!A.restEnd){return A.phase==='rest'?'<div class="card center"><div class="muted">Timer stopped</div></div>':'';}
  const rem=Math.max(0,Math.ceil((A.restEnd-Date.now())/1000));
  const pct=Math.min(100,Math.max(0,100*(A.restEnd-Date.now())/(A.restTotal*1000)));
  return '<div class="card" id="timerCard"><div class="muted center">Rest</div><div class="timer" id="rt">'+clock(rem)+'</div><div class="bar"><i id="rb" style="width:'+pct+'%"></i></div>'+
  '<div class="row"><button class="btn grow" data-act="skipRest">Skip</button><button class="btn grow" data-act="addTime">+30s</button><button class="btn grow" data-act="stopRest">Stop</button></div></div>';
}
function runView(){
  const A=S.active,e=A.entries[A.idx],n=A.entries.length;
  const rg=range(e.repMin,e.repMax);
  let h='<header class="top"><div class="grow"><h1>'+esc(A.name)+'</h1></div><button class="btn sm" data-act="finishEarly">Finish…</button></header><main>';
  h+='<div class="muted sm">Exercise '+(A.idx+1)+' of '+n+'</div>';
  h+='<div class="card center"><h2 class="exname">'+esc(e.name)+'</h2>'+
    (A.phase==='done'?'<div class="setlbl ok">All sets done ✓</div>':'<div class="setlbl">Set '+Math.min(e.sets.length+1,e.nSets)+' of '+e.nSets+'</div>')+
    (e.type==='weighted'?'<div class="target">'+fmt(e.weight)+'<small> kg</small></div><div class="muted">Target '+rg+' reps</div>':'<div class="target">'+rg+'<small> reps</small></div><div class="muted">Bodyweight · target rep range</div>');
  const ln=lastNote(e.exId);
  if(ln)h+='<div class="lastnote">Note from '+dFmt(ln.t,{day:'numeric',month:'short'})+': “'+esc(ln.note)+'”</div>';
  h+='</div>';
  const upcoming=A.entries.slice(A.idx+1).map(x=>x.name);
  if(upcoming.length)h+='<div class="muted sm center">Up next: '+esc(upcoming.join(' → '))+'</div>';
  if(A.phase==='rest'){
    h+=timerCard(A);
    if(!A.restEnd)h+='<button class="btn primary block huge" data-act="nextSet">Next set</button>';
    h+='<div class="muted center mt">Next: set '+(e.sets.length+1)+' of '+e.nSets+'</div>';
  }else if(A.phase==='set'){
    const key=A.idx+'-'+e.sets.length;if(ui.repsKey!==key){ui.repsKey=key;ui.reps=e.repMax;}
    h+='<div class="card"><div class="muted center sm">Reps achieved</div><div class="stepper mt"><button class="btn" data-act="repDelta" data-d="-1" aria-label="Fewer reps">−</button><input id="repsIn" type="number" inputmode="numeric" min="0" value="'+ui.reps+'"><button class="btn" data-act="repDelta" data-d="1" aria-label="More reps">+</button></div></div>';
    h+='<button class="btn primary block huge" data-act="logSet">Log set</button>';
  }else{
    h+=timerCard(A);
    h+='<div class="card"><label class="lbl" for="note" style="margin-top:0">Notes for this exercise (optional)</label><textarea id="note" placeholder="e.g. felt easy, try more next time">'+esc(e.note)+'</textarea></div>';
    h+='<button class="btn primary block huge" data-act="nextEx">'+(A.idx>=n-1?'Finish workout':'Next exercise')+'</button>';
  }
  if(A.phase!=='done'){
    if(A.idx<n-1)h+='<button class="btn block mt" data-act="laterEx">Skip for now – come back later</button>';
    h+='<button class="btn block mt" data-act="skipEx">Skip this exercise today</button>';
  }

function chartExercises(){
  const m=new Map();
  for(const s of S.sessions.slice().sort((a,b)=>a.start-b.start))for(const e of s.entries)if(e.sets.length){
    const cur=m.get(e.exId)||{id:e.exId,n:0};cur.n++;cur.name=e.name;m.set(e.exId,cur);
  }
  return Array.from(m.values()).map(o=>{const ex=S.exercises[o.id];let label=o.name;
    if(ex&&ex.workoutId){const w=S.workouts.find(x=>x.id===ex.workoutId);label+=' ('+(w?w.name:'deleted workout')+')';}
    return {id:o.id,label:label,n:o.n};}).sort((a,b)=>a.label.localeCompare(b.label));
}
function chartData(exId){
  const out=[];
  for(const s of S.sessions.slice().sort((a,b)=>a.start-b.start))for(const e of s.entries)if(e.exId===exId&&e.sets.length){
    const avg=e.sets.reduce((a,b)=>a+b,0)/e.sets.length;
    out.push(e.type==='weighted'?{t:s.start,a:e.weight,b:avg,e:e}:{t:s.start,a:avg,b:e.repMax,e:e});
  }
  return out;
}
function chartSvg(pts,sel){
  const W=360,H=240,L=44,R=44,T=14,B=38,pw=W-L-R,ph=H-T-B,n=pts.length;
  const X=i=>n===1?L+pw/2:L+pw*i/(n-1);
  const dom=k=>{const v=pts.map(p=>p[k]);let mn=Math.min.apply(null,v),mx=Math.max.apply(null,v);if(mn===mx){mn-=1;mx+=1;}const pad=(mx-mn)*.12;let lo=mn-pad;if(mn>=0&&lo<0)lo=0;return [lo,mx+pad];};
  const d1=dom('a'),d2=dom('b');
  const Y=(v,d)=>T+ph*(1-(v-d[0])/(d[1]-d[0]));
  const f1=v=>String(Math.round(v*10)/10);
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Progress chart">';
  for(let k=0;k<=4;k++){
    const y=T+ph*k/4;
    s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" class="grid"/>';
    s+='<text x="'+(L-6)+'" y="'+(y+3)+'" class="ax a" text-anchor="end">'+f1(d1[1]-(d1[1]-d1[0])*k/4)+'</text>';
    s+='<text x="'+(W-R+6)+'" y="'+(y+3)+'" class="ax b">'+f1(d2[1]-(d2[1]-d2[0])*k/4)+'</text>';
  }
  const idx=n<=4?pts.map((_,i)=>i):[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1];
  idx.filter((v,i,a)=>a.indexOf(v)===i).forEach(i=>{s+='<text x="'+X(i)+'" y="'+(H-B+16)+'" class="ax" text-anchor="middle">'+dFmt(pts[i].t,{day:'numeric',month:'short'})+'</text>';});
  if(n>1){
    s+='<polyline class="l2" points="'+pts.map((p,i)=>X(i)+','+Y(p.b,d2)).join(' ')+'"/>';
    s+='<polyline class="l1" points="'+pts.map((p,i)=>X(i)+','+Y(p.a,d1)).join(' ')+'"/>';
  }
  pts.forEach((p,i)=>{s+='<circle cx="'+X(i)+'" cy="'+Y(p.b,d2)+'" r="3.5" class="p2"/><circle cx="'+X(i)+'" cy="'+Y(p.a,d1)+'" r="4.5" class="p1"/>';});
  s+='<line x1="'+X(sel)+'" y1="'+T+'" x2="'+X(sel)+'" y2="'+(T+ph)+'" class="sel"/>';
  pts.forEach((p,i)=>{s+='<circle cx="'+X(i)+'" cy="'+(T+ph/2)+'" r="0" />';});
  // wide invisible hit columns
  pts.forEach((p,i)=>{const w=n===1?pw:pw/(n-1);s+='<rect x="'+(X(i)-Math.max(14,w/2))+'" y="'+T+'" width="'+Math.max(28,w)+'" height="'+ph+'" fill="transparent" data-act="chartPt" data-i="'+i+'"/>';});
  return s+'</svg>';
}
function chartsHtml(){
  const list=chartExercises();
  if(!list.length)return '<div class="card muted">Charts appear once you have logged an exercise.</div>';
  if(!list.some(x=>x.id===ui.chartEx))ui.chartEx=list[0].id;
  const pts=chartData(ui.chartEx);
  let sel=ui.chartSel;if(sel==null||sel>=pts.length)sel=pts.length-1;
  const wtd=pts[0].e.type==='weighted';
  let h='<label class="lbl" for="chartEx">Exercise</label><select id="chartEx">'+list.map(x=>'<option value="'+x.id+'"'+(x.id===ui.chartEx?' selected':'')+'>'+esc(x.label)+'</option>').join('')+'</select>';
  h+='<div class="card mt">'+chartSvg(pts,sel)+'<div class="sm mt"><span class="dot" style="background:var(--accent)"></span>'+(wtd?'Weight (kg) – left axis':'Avg reps per set – left axis')+'<br><span class="dot" style="background:var(--accent2)"></span>'+(wtd?'Avg reps per set – right axis':'Top of target range – right axis')+'</div>'+(pts.length<2?'<div class="muted sm mt">Log this exercise a few more times to see a trend line.</div>':'')+'</div>';
  const p=pts[sel],e=p.e;
  h+='<div class="card"><b>'+dFmt(p.t)+'</b><div>'+(wtd?fmt(e.weight)+' kg':'Target '+range(e.repMin,e.repMax)+' reps')+'</div><div>'+e.sets.map((r,j)=>'<span class="chip" style="min-height:36px">'+r+'</span>').join('')+'</div>'+(e.note&&e.note.trim()?'<div class="lastnote">'+esc(e.note)+'</div>':'')+'<div class="muted sm mt">Tap the chart to see another session.</div></div>';

act.exSave=()=>{
  readExForm();const f=ui.exf,d=f.d,name=String(d.name).trim();
  const repMin=num(d.repMin),repMax=num(d.repMax),sets=num(d.sets),rest=num(d.rest);
  const bad=m=>{f.err=m;openModal(exFormHtml());};
  if(!name)return bad('Please enter a name.');
  if(!Number.isInteger(repMin)||repMin<1)return bad('Min reps must be a whole number, 1 or more.');
  if(!Number.isInteger(repMax)||repMax<repMin)return bad('Max reps must be a whole number, at least the min.');
  if(!Number.isInteger(sets)||sets<1||sets>20)return bad('Sets must be a whole number from 1 to 20.');
  if(!Number.isInteger(rest)||rest<0||rest>3600)return bad('Rest must be a whole number of seconds (0 or more).');
  const o={name:name,type:d.type,repMin:repMin,repMax:repMax,sets:sets,rest:rest};
  if(d.type==='weighted'){const inc=num(d.inc),weight=num(d.weight);
    if(!(inc>0))return bad('Weight increment must be more than 0.');
    if(!(weight>=0))return bad('Weight must be 0 or more.');
    o.inc=r2(inc);o.weight=r2(weight);
  }else{const st=num(d.repStep);if(!Number.isInteger(st)||st<1)return bad('Rep step must be a whole number, 1 or more.');o.repStep=st;}
  if(f.id)Object.assign(S.exercises[f.id],o);
  else{
    const ex=Object.assign({id:uid(),workoutId:f.ctx.workoutId||null},o);S.exercises[ex.id]=ex;
    if(f.ctx.addTo){const w=S.workouts.find(x=>x.id===f.ctx.addTo);if(w)w.items.push({exId:ex.id});}
  }
  closeModal();save();render();
};
act.exDelete=()=>{
  const id=ui.exf.id,ex=S.exercises[id];
  confirmDlg('Delete “'+esc(ex.name)+'” from your library and remove it from all workouts? Past sessions stay in History.','Delete',()=>{
    S.workouts.forEach(w=>{w.items=w.items.filter(i=>i.exId!==id);});delete S.exercises[id];save();render();},true);
};

// running a workout
act.start=d=>{
  unlockAudio();
  const w=S.workouts.find(x=>x.id===d.id),entries=[];
  w.items.forEach(it=>{const ex=S.exercises[it.exId];if(ex)entries.push(makeEntry(ex));});
  if(!entries.length){toast('Add some exercises first');return;}
  S.active={workoutId:w.id,name:w.name,start:Date.now(),idx:0,phase:'set',restEnd:null,restTotal:0,entries:entries};
  ui.repsKey='';save();requestWake();render();
};
function startRest(sec){const A=S.active;if(sec>0){A.restEnd=Date.now()+sec*1000;A.restTotal=sec;}else A.restEnd=null;}
act.repDelta=d=>{ui.reps=Math.max(0,Math.min(999,(+ui.reps||0)+(+d.d)));const el=$('#repsIn');if(el)el.value=ui.reps;};
act.logSet=()=>{
  const A=S.active,e=A.entries[A.idx];if(A.phase!=='set')return;
  const el=$('#repsIn');if(el)ui.reps=parseInt(el.value,10);
  e.sets.push(Math.max(0,Math.min(999,Math.round(+ui.reps||0))));
  if(e.sets.length>=e.nSets){e.complete=true;A.phase='done';}else{A.phase=e.rest>0?'rest':'set';}
  startRest(e.rest);save();render();
};
act.skipRest=()=>{const A=S.active;A.restEnd=null;if(A.phase==='rest')A.phase='set';save();render();};
act.stopRest=()=>{const A=S.active;A.restEnd=null;save();render();};
act.addTime=()=>{const A=S.active;if(A.restEnd){A.restEnd+=30000;A.restTotal+=30;save();tick();}};
act.nextSet=()=>{S.active.phase='set';save();render();};
function advance(){
  const A=S.active;A.restEnd=null;
  if(A.idx>=A.entries.length-1){finishWorkout();return;}
  A.idx++;A.phase='set';save();render();
}
act.nextEx=advance;
act.skipEx=()=>{const A=S.active;A.entries[A.idx].skipped=true;advance();};
act.laterEx=()=>{
  const A=S.active,left=A.entries.length-1-A.idx;if(left<1)return;
  openModal('<h3>Come back to this exercise later</h3><p class="muted sm">Any sets you have already logged for it are kept. Where should it go?</p>'+
    (left>1?'<button class="btn block" data-act="moveEx" data-w="next">After the next exercise</button>':'')+
    '<button class="btn block mt" data-act="moveEx" data-w="end">At the end of the workout</button><button class="btn block mt" data-act="closeM">Cancel</button>');
};
act.moveEx=d=>{
  const A=S.active;if(A.entries.length-1-A.idx<1){closeModal();return;}
  const e=A.entries.splice(A.idx,1)[0];
  if(d.w==='next')A.entries.splice(A.idx+1,0,e);else A.entries.push(e);
  A.phase='set';A.restEnd=null;ui.repsKey='';
  closeModal();save();render();toast(e.name+' moved to later');
};
act.finishEarly=()=>openModal('<h3>Finish workout?</h3><p class="muted">Sets you have logged are saved. Skipped or unfinished exercises will not change progression.</p><button class="btn primary block" data-act="finishNow">Save and finish</button><button class="btn danger block mt" data-act="discardW">Discard workout</button><button class="btn block mt" data-act="closeM">Keep going</button>');
act.finishNow=()=>{closeModal();finishWorkout();};
act.discardW=()=>confirmDlg('Discard this workout? Nothing will be saved.','Discard',()=>{S.active=null;releaseWake();save();render();},true);
function finishWorkout(){
  const A=S.active;releaseWake();
  const entries=A.entries.filter(e=>e.sets.length).map(e=>{const c=Object.assign({},e);c.complete=!!(e.complete&&!e.skipped&&e.sets.length>=e.nSets);return c;});
  const changes=[];
  entries.forEach(e=>{if(!e.complete)return;const ex=S.exercises[e.exId];if(ex)changes.push(applyProgression(ex,e));});
  const end=Date.now();
  if(entries.length){S.sessions.push({id:uid(),workoutId:A.workoutId,name:A.name,start:A.start,end:end,entries:entries});rotateAfter(A.workoutId,A.start);}
  ui.summary={name:A.name,saved:entries.length>0,changes:changes,incomplete:entries.filter(e=>!e.complete).map(e=>e.name),dur:Math.max(1,Math.round((end-A.start)/60000)),next:(entries.length&&S.workouts.length>1)?S.workouts[0].name:null};
  S.active=null;save();render();
}
act.doneSummary=()=>{ui.summary=null;ui.tab='workouts';render();};

// edit sets (current workout and history)
function editModal(){const x=ui.edit;openModal('<h3>'+esc(x.title)+'</h3><div class="stepper"><button class="btn" data-act="editDelta" data-d="-1">−</button><input id="editVal" type="number" inputmode="numeric" min="0" value="'+x.val+'"><button class="btn" data-act="editDelta" data-d="1">+</button></div><div class="row mt"><button class="btn grow" data-act="closeM">Cancel</button><button class="btn primary grow" data-act="editSave">Save</button></div>');}
act.editSet=d=>{const e=S.active.entries[+d.e];ui.edit={ses:null,e:+d.e,j:+d.s,val:e.sets[+d.s],title:e.name+' – set '+(+d.s+1)};editModal();};
act.editHSet=d=>{const s=S.sessions.find(x=>x.id===d.s),e=s.entries[+d.e];ui.edit={ses:s.id,e:+d.e,j:+d.j,val:e.sets[+d.j],title:e.name+' – set '+(+d.j+1)};editModal();};
act.editDelta=d=>{const el=$('#editVal');el.value=Math.max(0,Math.min(999,(parseInt(el.value,10)||0)+(+d.d)));};
act.editSave=()=>{
  const x=ui.edit,v=Math.max(0,Math.min(999,parseInt($('#editVal').value,10)||0));
  if(x.ses===null){S.active.entries[x.e].sets[x.j]=v;}
  else{
    const s=S.sessions.find(q=>q.id===x.ses),e=s.entries[x.e];e.sets[x.j]=v;
    const ex=S.exercises[e.exId];
    if(e.complete&&ex){const latest=latestComplete(e.exId);if(latest&&latest.e===e)applyProgression(ex,e);}
  }
  closeModal();save();render();
};

// log a past workout / delete a session
act.pastStart=()=>{
  if(!S.workouts.length){openModal('<h3>Log a past workout</h3><p class="muted">Create the workout first (Workouts tab) and add its exercises, then you can log past sessions of it.</p><button class="btn block" data-act="closeM">OK</button>');return;}
  openModal('<h3>Which workout?</h3>'+S.workouts.map(w=>'<button class="btn block mt" data-act="pastPick" data-id="'+w.id+'">'+esc(w.name)+'</button>').join('')+'<button class="btn block mt" data-act="closeM">Cancel</button>');
};
act.pastPick=d=>{ui.past={wid:d.id,date:todayISO()};closeModal();render();};
act.pastCancel=()=>{ui.past=null;render();};
act.pastAddSet=d=>{
  const box=$('#ps_'+d.i);if(!box)return;
  let n=0;while($('#pr_'+d.i+'_'+n))n++;
  box.insertAdjacentHTML('beforeend','<input id="pr_'+d.i+'_'+n+'" type="number" inputmode="numeric" min="0" placeholder="S'+(n+1)+'" style="width:72px;text-align:center">');
};
act.pastSave=d=>{
  const p=ui.past,w=S.workouts.find(x=>x.id===p.wid);if(!w)return;
  const dv=($('#pDate').value||'').trim(),m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(dv);
  if(!m){toast('Pick the date of the workout');return;}
  if(dv>todayISO()){toast('That date is in the future');return;}
  p.date=dv;
  const start=new Date(+m[1],+m[2]-1,+m[3],12,0,0).getTime(),entries=[];
  for(let i=0;i<w.items.length;i++){
    const ex=S.exercises[w.items[i].exId];if(!ex)continue;
    const sets=[];
    for(let j=0;j<60;j++){
      const inp=$('#pr_'+i+'_'+j);if(!inp)break;
      const v=String(inp.value).trim();if(v==='')continue;
      const n=Number(v);
      if(!Number.isInteger(n)||n<0||n>999){toast('Check the reps for '+ex.name);return;}
      sets.push(n);
    }
    if(!sets.length)continue;
    let weight=null;
    if(ex.type==='weighted'){weight=num($('#pw_'+i).value);if(!(weight>=0)){toast('Check the weight for '+ex.name);return;}weight=r2(weight);}
    entries.push({exId:ex.id,name:ex.name,type:ex.type,weight:weight,repMin:ex.repMin,repMax:ex.repMax,nSets:ex.sets,rest:ex.rest,sets:sets,note:'',skipped:false,complete:sets.length>=ex.sets});
  }
  if(!entries.length){toast('Enter the reps for at least one exercise');return;}
  S.sessions.push({id:uid(),workoutId:w.id,name:w.name,start:start,end:start,manual:true,entries:entries});
  entries.forEach(e=>{if(!e.complete)return;const ex=S.exercises[e.exId],l=latestComplete(e.exId);if(ex&&l&&l.e===e)applyProgression(ex,e);});
  rotateAfter(w.id,start);
  save();
  if(d.again){ui.viewKey='';render();toast('Saved – log another');}
  else{ui.past=null;ui.histMode='sessions';render();toast('Past workout added');}
};
act.delSession=d=>{
  const s=S.sessions.find(x=>x.id===d.s);if(!s)return;
  confirmDlg('Delete the <b>'+esc(s.name)+'</b> session from '+esc(dFmt(s.start))+'? This cannot be undone.','Delete',()=>{
    const wasLatest=s.entries.filter(e=>e.complete&&(latestComplete(e.exId)||{}).e===e).map(e=>e.exId);
    S.sessions=S.sessions.filter(x=>x!==s);
    wasLatest.forEach(id=>{const ex=S.exercises[id],l=latestComplete(id);if(ex&&l)applyProgression(ex,l.e);});
    save();render();toast('Session deleted');
  },true);
};

// backup / restore / misc
act.backup=()=>{
  S.lastBackup=Date.now();save();
  const data=Object.assign({},S,{active:null});
  const blob=new Blob([JSON.stringify({app:'gymlog',version:1,exported:new Date().toISOString(),data:data},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  const dt=new Date();a.download='gym-backup-'+dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  toast('Backup file saved – check your Downloads');render();
};
act.restore=()=>{$('#restoreFile').click();};
$('#restoreFile').addEventListener('change',ev=>{
  const f=ev.target.files[0];ev.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let d;try{const j=JSON.parse(rd.result);d=j&&j.data?j.data:j;
      if(!d||typeof d.exercises!=='object'||!Array.isArray(d.workouts)||!Array.isArray(d.sessions))throw new Error('bad');}
    catch(e){toast('That file is not a valid backup');return;}
    const doIt=()=>{S=Object.assign(blank(),d,{active:null});ui.editWorkout=null;ui.chartEx=null;save();render();toast('Backup restored');};
    const hasData=S.sessions.length||S.workouts.length||Object.keys(S.exercises).length;
    if(hasData)confirmDlg('Restoring will <b>replace everything</b> currently in the app ('+S.workouts.length+' workouts, '+S.sessions.length+' sessions) with the backup ('+d.workouts.length+' workouts, '+d.sessions.length+' sessions). Continue?','Replace data',doIt,true);
    else doIt();
  };
  rd.readAsText(f);
});
act.erase=()=>confirmDlg('Erase <b>all</b> exercises, workouts and history from this phone? Back up first if you might want it again.','Erase everything',()=>{S=blank();ui.editWorkout=null;save();render();toast('All data erased');},true);
act.install=()=>{if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render();}};

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  unlockAudio();
  const el=ev.target.closest&&ev.target.closest('[data-act]');if(!el)return;
  const f=act[el.dataset.act];if(f)f(el.dataset,el,ev);
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='repsIn'){ui.reps=parseInt(ev.target.value,10)||0;}
  else if(ev.target.id==='note'&&S.active){S.active.entries[S.active.idx].note=ev.target.value;save();}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='wName'){const w=S.workouts.find(x=>x.id===ui.editWorkout);if(w){w.name=ev.target.value.trim()||w.name;ev.target.value=w.name;save();}}
  else if(ev.target.id==='chartEx'){ui.chartEx=ev.target.value;ui.chartSel=null;render();}
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(!S.active&&ui.tab==='settings')render();});

/* ---------- rest timer (based on the real clock) ---------- */
function tick(){
  const A=S.active;if(!A||!A.restEnd)return;
  const rem=A.restEnd-Date.now();
  if(rem<=0){
    const late=-rem;A.restEnd=null;
    const wasRest=A.phase==='rest';if(wasRest)A.phase='set';
    save();if(late<8000)alertUser();
    if(wasRest)render();else{const c=$('#timerCard');if(c)c.remove();}
    return;
  }
  const el=$('#rt');if(el)el.textContent=clock(Math.ceil(rem/1000));
  const b=$('#rb');if(b)b.style.width=Math.min(100,Math.max(0,100*rem/(A.restTotal*1000)))+'%';
}
setInterval(tick,250);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){requestWake();tick();}});

/* ---------- start ---------- */
render();
if(S.active)requestWake();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
window.__gym={get S(){return S;},set S(v){S=v;},act:act,ui:ui,render:render,tick:tick};
})();
</script>
</body>
</html>
